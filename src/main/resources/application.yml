spring:
  application:
    name: gffh-api
  data:
    mongodb:
      # Credentials come from secrets management, never from this file
      # (Technical Specification section 17).
      uri: ${MONGODB_URI:mongodb://localhost:27017/db-gffh}
      auto-index-creation: false   # indexes are managed explicitly, see IndexConfig
  mail:
    # Host, port, username and password come from SPRING_MAIL_HOST,
    # SPRING_MAIL_PORT, SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD. With no
    # host set, no mail sender exists and tokens are logged instead (EmailService).
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false   # ISO-8601, per API design standards

server:
  port: ${PORT:8090}
  error:
    include-stacktrace: never
    include-message: never

gffh:
  mail:
    # Sender address, e.g. "Kickabout <noreply@example.com>".
    from: ${MAIL_FROM:}
    # Where the links in emails point: the web app, which has /verify-email
    # and /reset-password pages.
    app-base-url: ${APP_BASE_URL:https://grassroots-football-friendly-hub-we.vercel.app}
    # The help address the clients show (GET /api/v1/config). When unset, the
    # bare address inside MAIL_FROM is used; with neither, there is none.
    support-email: ${SUPPORT_EMAIL:}
  oauth:
    # Google and Apple sign-in, each off until its IDs are set. Published to
    # the clients by GET /api/v1/config (see OAuthProperties).
    google:
      # The Google OAuth *Web* client ID: the web button, Android Credential
      # Manager's serverClientId, and an accepted token audience.
      client-id: ${GOOGLE_CLIENT_ID:}
      # More accepted audiences, comma-separated (e.g. an iOS client ID).
      additional-client-ids: ${GOOGLE_ADDITIONAL_CLIENT_IDS:}
    apple:
      # Services ID for web sign-in (an accepted audience).
      services-id: ${APPLE_SERVICES_ID:}
      # The iOS app's bundle ID (the audience of native iOS tokens).
      bundle-id: ${APPLE_BUNDLE_ID:}
  jwt:
    # PKCS#8 PEM RSA private key used to sign access tokens. Set it in every
    # deployed environment so tokens survive restarts; when unset, a key is
    # generated per startup (fine locally). See JwtKeyConfig.
    private-key: ${JWT_PRIVATE_KEY:}
  cors:
    # Defaults to the two local Vite dev servers (gffh-web, gffh-admin) plus
    # the hosted gffh-web Vercel deployment, so local development and that
    # deployment both work without remembering to set the env var every time
    # - never a wildcard, and a real production deployment overrides this
    # completely via CORS_ALLOWED_ORIGINS rather than extending it.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://grassroots-football-friendly-hub-we.vercel.app,https://grassroots-football-friendly-hub-ad.vercel.app}
  admin:
    # Whether admin sign-in also asks for an authenticator-app code. Off by
    # default: password only. Set ADMIN_TOTP_REQUIRED=true to turn it back on
    # (admins created while it was off then need their secret from bootstrap).
    totp-required: ${ADMIN_TOTP_REQUIRED:false}
  auth:
    cookie:
      # The web app's refresh-token cookie. SameSite=None while the web app
      # calls the API cross-site (Vercel to Render). If /api is ever proxied
      # through the web app's own domain, Lax is stricter and works in every
      # browser. Secure must stay on outside local http development.
      same-site: ${AUTH_COOKIE_SAME_SITE:None}
      secure: ${AUTH_COOKIE_SECURE:true}
  matching:
    # Startup defaults; the live values are published through ADM-08.
    weights:
      age: 25
      availability: 25
      format: 15
      distance: 15
      home-away: 10
      ability: 10
    age-band-tolerance: 0
  rate-limits:
    invitations-per-hour: 20
    auth-attempts-per-hour: 10

management:
  health:
    # An SMTP outage must not mark the whole API unhealthy and get it restarted.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
  level:
    com.gffh.api: INFO
