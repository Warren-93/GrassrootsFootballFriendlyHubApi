services:
  - type: web
    name: gffh-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: GIPHY_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_ADDITIONAL_CLIENT_IDS
        sync: false
      - key: APPLE_SERVICES_ID
        sync: false
      - key: APPLE_BUNDLE_ID
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false
      - key: APNS_BUNDLE_ID
        sync: false
      - key: APNS_PRODUCTION
        sync: false
